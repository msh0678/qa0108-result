<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="워크플로 실행 결과를 카드로 보여주는 화면">
<!--ethos-data:{"step":true}-->
<title>결과 화면</title>
<link rel="stylesheet" href="./css/style.css">
<script src="./js/app.js" defer></script>
</head>
<body>
<header>
<h1>처리 결과</h1>
<p>워크플로 실행 결과를 카드로 확인합니다</p>
</header>
<main>
<section class="card" aria-label="결과 목록">
<h2 id="resTitle">결과</h2>
<p class="muted" id="resDesc">아래는 전달받은 결과 항목입니다.</p>
<div id="cards"></div>
<p class="msg" id="empty" role="status" aria-live="polite"></p>
<button type="button" class="ghost" id="topBtn">맨 위로</button>
<p class="offline" id="offlineNote" hidden>에토스 워크플로에서 열면 실제 작업이 표시됩니다</p>
</section>
</main>

</body>
</html>
